<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>el secret arcade</title>
<style>
:root{--bg:#080809;--panel:#101012;--line:#29292d;--text:#eeeef0;--muted:#77777d;--accent:#b7ff75}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;image-rendering:pixelated}
.wrap{width:min(900px,calc(100% - 28px));margin:auto}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
a{color:inherit;text-decoration:none}.brand{font-size:14px;font-weight:700}.back{font-size:12px;color:var(--muted)}
main{padding:34px 0 50px}
h1{font-size:34px;letter-spacing:-2px;margin:0 0 7px}.sub{font-size:12px;color:var(--muted);margin-bottom:25px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
button{font:inherit;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 11px;cursor:pointer}
button:hover,button.active{color:var(--text);border-color:#4a4a50;background:#171719}
.arcade{background:#050506;border:1px solid var(--line);padding:18px;border-radius:7px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px}
#score{color:var(--accent)}#status{color:var(--muted)}
canvas{display:block;width:min(100%,640px);height:auto;aspect-ratio:4/3;margin:auto;background:#030304;border:1px solid #202024;image-rendering:pixelated}
.help{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
.mobile{display:none;justify-content:center;gap:5px;margin-top:13px}
.mobile button{width:45px;height:38px;padding:0}
footer{color:#454549;font-size:10px;text-align:center;margin-top:25px}
@media(max-width:600px){.mobile{display:flex}.arcade{padding:10px}h1{font-size:29px}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="index.html">deniba.xyz</a><a class="back" href="index.html">← back</a></header>
<main>
<h1>Arcade</h1>
<div class="sub">small games · no downloads · probably a waste of time</div>
<div class="tabs">
<button class="active" data-game="snake">01 / snake</button>
<button data-game="flappy">02 / flappy</button>
<button data-game="pong">03 / pong</button>
<button data-game="breakout">04 / breakout</button>
</div>
<div class="arcade">
<div class="top"><span id="gameName">SNAKE</span><span id="score">0000</span></div>
<canvas id="game" width="128" height="96"></canvas>
<div class="help" id="help">Arrow keys / WASD · Space to start</div>
<div class="mobile" id="mobile">
<button data-key="up">▲</button>
<button data-key="left">◀</button>
<button data-key="down">▼</button>
<button data-key="right">▶</button>
</div>
</div>
<footer>© 2026 Deni · made for deniba.xyz</footer>
</main>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),statusEl=document.getElementById('status');
x.imageSmoothingEnabled=false;
let game='snake',running=false,score=0,raf,last=0,keys={};

function clear(){x.fillStyle='#030304';x.fillRect(0,0,128,96)}
function txt(t,px,py,size=7){x.fillStyle='#eeeef0';x.font=`${size}px monospace`;x.textAlign='center';x.fillText(t,px,py)}
function scoreSet(n){score=n;scoreEl.textContent=String(n).padStart(4,'0')}
function start(){running=true;scoreSet(0);last=0;init();requestAnimationFrame(loop)}
function stop(){running=false;cancelAnimationFrame(raf)}
function loop(t){if(!running)return;if(!last)last=t;let dt=t-last;last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function init(){if(game==='snake')snakeInit();if(game==='flappy')flappyInit();if(game==='pong')pongInit();if(game==='breakout')breakInit()}
function update(dt){if(game==='snake')snakeUpdate(dt);if(game==='flappy')flappyUpdate(dt);if(game==='pong')pongUpdate(dt);if(game==='breakout')breakUpdate(dt)}
function draw(){if(game==='snake')snakeDraw();if(game==='flappy')flappyDraw();if(game==='pong')pongDraw();if(game==='breakout')breakDraw()}

let snake,dir,nextDir,food,st;
function snakeInit(){snake=[{x:64,y:48},{x:60,y:48},{x:56,y:48}];dir={x:1,y:0};nextDir=dir;food={x:92,y:44};st=0}
function snakeUpdate(dt){
st+=dt;if(st<105)return;st=0;dir=nextDir;
let h={x:snake[0].x+dir.x*4,y:snake[0].y+dir.y*4};
if(h.x<0||h.x>=128||h.y<0||h.y>=96||snake.some((p,i)=>i&&p.x===h.x&&p.y===h.y)){gameOver();return}
snake.unshift(h);
if(h.x===food.x&&h.y===food.y){scoreSet(score+10);placeFood()}else snake.pop()
}
function placeFood(){food={x:Math.floor(Math.random()*32)*4,y:Math.floor(Math.random()*24)*4}}
function snakeDraw(){clear();x.fillStyle='#b7ff75';snake.forEach((p,i)=>x.fillRect(p.x,p.y,4,4));x.fillStyle='#fff';x.fillRect(food.x,food.y,4,4)}
function setDir(dx,dy){if(dir.x+dx===0&&dir.y+dy===0)return;nextDir={x:dx,y:dy}}

let bird,pipes,flapTime;
function flappyInit(){bird={x:27,y:48,vy:0};pipes=[];flapTime=0}
function flappyUpdate(dt){
flapTime+=dt;bird.vy+=.00065*dt;bird.y+=bird.vy*dt;
if(flapTime>1500){flapTime=0;let gap=28,gy=18+Math.random()*42;pipes.push({x:128,gy,gap,passed:false})}
pipes.forEach(p=>p.x-=.045*dt);pipes=pipes.filter(p=>p.x>-12);
for(const p of pipes){if(!p.passed&&p.x+7<bird.x){p.passed=true;scoreSet(score+1)}
if(bird.x+3>p.x&&bird.x-3<p.x+8&&(bird.y-3<p.gy||bird.y+3>p.gy+p.gap))gameOver()}
if(bird.y<2||bird.y>94)gameOver()
}
function flap(){if(!running){start();return}bird.vy=-.16}
function flappyDraw(){clear();x.fillStyle='#b7ff75';x.fillRect(bird.x-3,bird.y-3,7,7);x.fillStyle='#eeeef0';pipes.forEach(p=>{x.fillRect(p.x,0,8,p.gy);x.fillRect(p.x,p.gy+p.gap,8,96)})}

let ball,paddle1,paddle2,serve;
function pongInit(){ball={x:64,y:48,vx:.16,vy:.1};paddle1=43;paddle2=43;serve=0}
function pongUpdate(dt){
paddle1+=((keys.w?-0.22:0)+(keys.s?.22:0))*dt;paddle1=Math.max(0,Math.min(84,paddle1));
paddle2+=((ball.y-(paddle2+6))*.005*dt);paddle2=Math.max(0,Math.min(84,paddle2));
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
if(ball.y<2||ball.y>94){ball.vy*=-1;ball.y=Math.max(2,Math.min(94,ball.y))}
if(ball.x<8&&ball.y>paddle1&&ball.y<paddle1+12){ball.vx=Math.abs(ball.vx)*1.03;ball.x=8}
if(ball.x>120&&ball.y>paddle2&&ball.y<paddle2+12){ball.vx=-Math.abs(ball.vx)*1.03;ball.x=120}
if(ball.x<0){scoreSet(score+1);ball={x:64,y:48,vx:.16,vy:(Math.random()-.5)*.18}}
if(ball.x>128){scoreSet(score+1);ball={x:64,y:48,vx:-.16,vy:(Math.random()-.5)*.18}}
}
function pongDraw(){clear();x.fillStyle='#eeeef0';x.fillRect(4,paddle1,3,12);x.fillRect(121,paddle2,3,12);x.fillRect(ball.x-2,ball.y-2,4,4);for(let y=2;y<96;y+=8)x.fillRect(63,y,2,4)}

let px,bricks,bb;
function breakInit(){px=56;bricks=[];bb={x:64,y:78,vx:.095,vy:-.105};for(let r=0;r<4;r++)for(let col=0;col<12;col++)bricks.push({x:8+col*10,y:8+r*7,on:true})}
function breakUpdate(dt){
px+=(keys.a?-0.22:0)*dt+(keys.d?.22:0)*dt;px=Math.max(8,Math.min(104,px));bb.x+=bb.vx*dt;bb.y+=bb.vy*dt;
if(bb.x<2||bb.x>126){bb.vx*=-1;bb.x=Math.max(2,Math.min(126,bb.x))}
if(bb.y<2){bb.vy=Math.abs(bb.vy);bb.y=2}
if(bb.y>91){if(bb.x>px&&bb.x<px+24){bb.vy=-Math.abs(bb.vy);bb.y=88}else{gameOver();return}}
bricks.forEach(b=>{if(b.on&&bb.x>b.x&&bb.x<b.x+8&&bb.y>b.y&&bb.y<b.y+5){b.on=false;bb.vy*=-1;scoreSet(score+10)}})
}
function breakDraw(){clear();x.fillStyle='#eeeef0';bricks.forEach(b=>{if(b.on)x.fillRect(b.x,b.y,8,5)});x.fillRect(px,91,24,3);x.fillRect(bb.x-2,bb.y-2,4,4)}

function gameOver(){running=false;draw();setTimeout(()=>{txt('GAME OVER',64,45,9);txt('PRESS SPACE',64,58,7)},20)}
function changeGame(g){stop();game=g;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.game===g));document.getElementById('gameName').textContent=g.toUpperCase();scoreSet(0);init();draw()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>changeGame(b.dataset.game));
document.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
if(e.key===' '){if(game==='flappy')flap();else if(!running)start()}
if(game==='flappy' && (e.key==='ArrowUp'||e.key.toLowerCase()==='w')){flap();return}
if(game==='snake'){if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')setDir(0,-1);if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')setDir(0,1);if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')setDir(-1,0);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')setDir(1,0)}
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('#mobile button').forEach(b=>b.onclick=()=>{
let k=b.dataset.key;
if(game==='flappy'){flap();return}
if(game==='snake'){if(k==='up')setDir(0,-1);if(k==='down')setDir(0,1);if(k==='left')setDir(-1,0);if(k==='right')setDir(1,0)}
if(!running)start();
});
changeGame('snake');
</script>
</body>
</html>
