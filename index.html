<!DOCTYPE html>
<html>
<head>
    <title>deniba.xyz Latency</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: monospace;
            text-align: center;
            padding-top: 20vh;
        }

        #ping {
            font-size: 64px;
        }

        #status {
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="ping">-- ms</div>
    <div id="status">Testing deniba.xyz...</div>

    <script>
        async function measureLatency() {
            const start = performance.now();

            try {
                await fetch("https://deniba.xyz/?ping=" + Date.now(), {
                    method: "GET",
                    cache: "no-store"
                });

                const latency = Math.round(performance.now() - start);

                document.getElementById("ping").textContent =
                    latency + " ms";

                document.getElementById("status").textContent =
                    "HTTP response latency";
            } catch (e) {
                document.getElementById("ping").textContent = "ERROR";
                document.getElementById("status").textContent =
                    "Request failed";
            }
        }

        measureLatency();
        setInterval(measureLatency, 1000);
    </script>
</body>
</html>
