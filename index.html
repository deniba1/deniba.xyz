<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root {
    --lcd: #9ead4a;
    --ink: #1f2410;
    --case: #23231f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--case);
    color: var(--lcd);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .panel {
    position: relative;
    padding: 14px;
    background: var(--lcd);
    border-radius: 6px;
    box-shadow: inset 0 0 0 3px rgba(31, 36, 16, .35);
  }
  canvas { display: block; image-rendering: pixelated; }
  .hud {
    display: flex;
    justify-content: space-between;
    width: min(92vw, 428px);
    font-size: 13px;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .8;
  }
  #overlay {
    position: absolute;
    inset: 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(158, 173, 74, .92);
    color: var(--ink);
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay strong { font-size: 20px; letter-spacing: .1em; }
  #overlay span { font-size: 12px; }
</style>
</head>
<body>

<div class="hud">
  <span>Snake</span>
  <span>Score <b id="score">0</b></span>
</div>

<div class="panel">
  <canvas id="game" width="400" height="400"></canvas>
  <div id="overlay">
    <strong id="msg">Game over</strong>
    <span id="sub">Press space to play again</span>
  </div>
</div>

<div class="hud"><span>Arrow keys or WASD</span></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CELL = 20;                       // pixel size of one grid square
const SIZE = canvas.width / CELL;      // 20 x 20 grid

let snake, dir, nextDir, food, score, alive, timer;

function start() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = dir;
  score = 0;
  alive = true;
  placeFood();
  document.getElementById('score').textContent = 0;
  document.getElementById('overlay').classList.remove('show');
  clearInterval(timer);
  timer = setInterval(tick, 120);
  draw();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // wall or self collision
  if (head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById('score').textContent = score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--lcd');
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#1f2410';

  // food: hollow square so it reads differently from the snake
  ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);

  snake.forEach(s => ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2));
}

function gameOver() {
  alive = false;
  clearInterval(timer);
  document.getElementById('msg').textContent = 'Game over — ' + score;
  document.getElementById('overlay').classList.add('show');
}

document.addEventListener('keydown', e => {
  const moves = {
    ArrowUp: {x: 0, y: -1}, w: {x: 0, y: -1},
    ArrowDown: {x: 0, y: 1}, s: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0}, a: {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}, d: {x: 1, y: 0}
  };
  const m = moves[e.key] || moves[e.key.toLowerCase()];

  if (m) {
    e.preventDefault();
    // ignore reversals straight into your own neck
    if (m.x !== -dir.x || m.y !== -dir.y) nextDir = m;
  }
  if (e.code === 'Space' && !alive) start();
});

start();
</script>
</body>
</html>
