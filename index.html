<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal profile page">
  <meta name="theme-color" content="#08080a">
  <title>deniba - profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background -->
  <div class="backdrop">
    <div class="backdrop-image"></div>
    <div class="backdrop-overlay"></div>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
  </div>

  <!-- Main profile -->
  <main class="page">
    <section class="profile" id="profile">

      <div class="profile-top">
        <div class="avatar-wrap">
          <img
            class="avatar"
            src="https://i.pinimg.com/236x/5a/bd/98/5abd985735a8fd4adcb0e795de6a1005.jpg?nii=t"
            alt="Profile picture"
          >
          <span class="presence"></span>
        </div>

        <div class="identity">
          <div class="name-row">
            <h1>Deni</h1>
            <span class="verified" title="Verified">✓</span>
          </div>
          <p>@deniba</p>
        </div>
      </div>

      <p class="bio">
        wasting claude tokens like a chud<br>
      </p>

      </div>

      <div class="now-playing">
        <div class="album">
          <div class="album-art"></div>
        </div>

        <div class="song">
          <span class="eyebrow">NOW PLAYING</span>
          <strong id="song-title">#BrooklynBloodPop!</strong>
          <span id="artist">SyKo</span>
        </div>

        <button class="play" id="play" aria-label="Play music">▶</button>

        <div class="equalizer" id="equalizer">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="bottom">
        <span><span class="dot"></span> online</span>
        <span class="views">1,284 views</span>
      </div>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
