<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deni</title>
<meta name="description" content="deni: professional vibe coder. projects, links and what i'm up to.">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://deniba.xyz/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="deni">
<meta property="og:title" content="deni">
<meta property="og:description" content="projects, links and what i'm up to.">
<meta property="og:url" content="https://deniba.xyz/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=3">
</head>
<body>
<canvas id="sky" class="sky" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<main class="page">
  <section class="card glass" id="card" aria-label="profile">
    <div class="card__edge" aria-hidden="true"></div>

    <div class="avatar" id="avatar">
      <img id="avatarImg" alt="" hidden>
      <span class="avatar__mono" id="avatarMono">d</span>
      <span class="avatar__status" id="statusDot" data-status="offline" hidden></span>
    </div>

    <h1 class="name"><span id="name">deni</span> <span class="name__mark" title="that's me">✦</span></h1>
    <p class="handle" id="handle">@deniba1</p>
    <p class="bio" id="bio"></p>

    <div class="presence" id="presence" data-status="offline" hidden>
      <span class="presence__dot" aria-hidden="true"></span>
      <span class="presence__text" id="presenceText">offline</span>
    </div>

    <div class="activity" id="activity" hidden>
      <img class="activity__art" id="activityArt" alt="">
      <div class="activity__info">
        <span class="activity__kind" id="activityKind">listening to spotify</span>
        <span class="activity__title" id="activityTitle"></span>
        <span class="activity__sub" id="activitySub"></span>
        <div class="activity__bar" id="activityBar" hidden><span id="activityFill"></span></div>
        <div class="activity__times" id="activityTimes" hidden><span id="activityElapsed">0:00</span><span id="activityTotal">0:00</span></div>
      </div>
    </div>

    <dl class="meta">
      <div class="meta__item"><dt>my time</dt><dd id="clock">--:--</dd></div>
      <div class="meta__item"><dt>location</dt><dd id="location">earth</dd></div>
      <div class="meta__item" id="repoItem" hidden><dt>repos</dt><dd id="repoCount">—</dd></div>
    </dl>

    <div class="rule" aria-hidden="true"></div>

    <nav class="socials" id="socials" aria-label="links"></nav>
  </section>

  <div class="col">
    <section class="block" aria-labelledby="projects-title">
      <h2 class="block__title" id="projects-title"><span class="block__num">01</span>projects</h2>
      <div class="grid" id="projects"></div>
    </section>

    <section class="block" id="reposBlock" aria-labelledby="repos-title" hidden>
      <h2 class="block__title" id="repos-title"><span class="block__num">02</span>more on github</h2>
      <div class="grid grid--compact" id="repos"></div>
    </section>

    <section class="block" aria-labelledby="stack-title">
      <h2 class="block__title" id="stack-title"><span class="block__num" id="stackNum">02</span>stack</h2>
      <ul class="chips" id="stack"></ul>
    </section>

    <footer class="foot">
      <span>© <span id="year">2026</span> deni</span>
      <span class="foot__dot" aria-hidden="true">·</span>
      <a href="https://github.com/deniba1/deniba.xyz" target="_blank" rel="noopener">source ↗</a>
    </footer>
  </div>
</main>

<div class="player glass" id="player" aria-label="music player" hidden>
  <div class="player__more" id="playerMore">
    <div class="player__inner">
      <div class="player__info">
        <a class="player__title-lg" id="pTitleLg" target="_blank" rel="noopener"></a>
        <div class="player__artist"><span class="player__e" id="pExplicit" hidden>E</span><span id="pArtist"></span></div>
      </div>
      <div class="player__seek">
        <span id="pCur">0:00</span>
        <input type="range" id="pSeek" min="0" max="1000" value="0" step="1" aria-label="seek">
        <span id="pDur">0:30</span>
      </div>
      <div class="player__row">
        <button class="pbtn pbtn--toggle" id="pShuffle" type="button" aria-label="shuffle" aria-pressed="true" title="shuffle">
          <svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button class="pbtn pbtn--toggle" id="pRepeat" type="button" aria-label="repeat song" aria-pressed="false" title="repeat song">
          <svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <div class="player__vol">
          <button class="pbtn" id="pMute" type="button" aria-label="mute" title="mute">
            <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path class="vol-wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/><path class="vol-x" d="m16 9 6 6M22 9l-6 6"/></svg>
          </button>
          <input type="range" id="pVol" min="0" max="100" value="50" step="1" aria-label="volume">
        </div>
        <a class="pbtn" id="pOpen" target="_blank" rel="noopener" aria-label="open in spotify" title="full song on spotify">
          <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Zm4.82 15.15a.65.65 0 0 1-.9.22c-2.46-1.5-5.56-1.84-9.2-1.01a.65.65 0 1 1-.3-1.27c3.99-.91 7.4-.52 10.18 1.17.3.19.4.59.22.89Zm1.28-2.86a.82.82 0 0 1-1.12.27c-2.82-1.73-7.11-2.23-10.44-1.22a.82.82 0 1 1-.47-1.57c3.8-1.15 8.53-.6 11.77 1.4.38.23.5.74.26 1.12Zm.11-2.97C14.83 8.8 9.27 8.62 6.04 9.6a.98.98 0 1 1-.57-1.88c3.7-1.12 9.86-.9 13.74 1.4a.98.98 0 0 1-1 1.7Z"/></svg>
        </a>
      </div>
      <div class="player__qhead"><span>up next</span><a id="pPlaylist" target="_blank" rel="noopener"></a></div>
      <ol class="player__queue" id="pQueue"></ol>
      <p class="player__note">no full version found, playing a 30-second preview</p>
    </div>
  </div>
  <div class="player__bar">
    <button class="pbtn pbtn--skip" id="pPrev" type="button" aria-label="previous song" title="previous">
      <svg viewBox="0 0 24 24"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg>
    </button>
    <button class="player__now" id="pNow" type="button" aria-label="show player controls">
      <span class="player__cover"><img id="pCover" alt=""></span>
      <span class="player__title"><span class="player__title-in" id="pTitle">loading…</span></span>
    </button>
    <button class="pbtn pbtn--skip" id="pNext" type="button" aria-label="next song" title="next">
      <svg viewBox="0 0 24 24"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"/></svg>
    </button>
    <span class="player__sep" aria-hidden="true"></span>
    <button class="pbtn pbtn--play" id="pPlay" type="button" aria-label="play" title="play">
      <svg class="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7 4.5v15l12.5-7.5L7 4.5Z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
  </div>
  <div class="player__line"><span id="pLine"></span></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js?v=3"></script>
<script src="assets/app.js?v=2"></script>
<script src="assets/player.js?v=2"></script>
</body>
</html>
