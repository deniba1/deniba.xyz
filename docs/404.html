<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · deniOS</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=5">
<style>
  .lost { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
  .lost .win { position: relative; width: min(420px, 100%); }
  .err { display: flex; gap: 16px; align-items: flex-start; }
  .err__icon { flex-shrink: 0; width: 40px; height: 40px; display: grid; place-items: center; font-family: var(--pixel); font-weight: 700; font-size: 26px; color: #fff; background: #b0304f; border: 2px solid var(--lo); box-shadow: var(--bevel); }
  .err h1 { font-family: var(--pixel); font-weight: 600; font-size: 20px; margin-bottom: 6px; }
  .err p { color: var(--muted); line-height: 1.5; }
  .err code { font-family: var(--mono); font-size: 12px; color: var(--a1); }
  .err__actions { display: flex; justify-content: flex-end; margin-top: 18px; }
  .err__actions a { font-family: var(--pixel); font-size: 15px; padding: 7px 18px; background: var(--win-2); border: 1px solid var(--lo); box-shadow: var(--bevel); outline: 1px dotted var(--faint); outline-offset: -5px; }
  .err__actions a:hover { background: #2a2140; }
  .err__actions a:active { box-shadow: var(--bevel-in); }
</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true" style="position:fixed"><span class="wallpaper__mark">✦</span><span class="wallpaper__name">deniOS</span></div>
<main class="lost">
  <section class="win is-active" aria-labelledby="t">
    <header class="win__bar"><span class="icon__img icon__img--system"></span><span class="win__title">error</span><span class="win__btns"><a class="win__btn win__btn--close" href="/" aria-label="close"><span class="g g--close"></span></a></span></header>
    <div class="win__body">
      <div class="err">
        <span class="err__icon" aria-hidden="true">!</span>
        <div>
          <h1 id="t">file not found (404)</h1>
          <p>deniOS couldn't find <code id="path">this page</code>. probably wasted a few tokens looking for it.</p>
        </div>
      </div>
      <div class="err__actions"><a href="/">ok</a></div>
    </div>
  </section>
</main>
<script>document.getElementById("path").textContent = location.pathname;</script>
</body>
</html>
